# Configuration file for the DQN agent and environment

qnetwork:
  # hidden_layers: [600, 400, 100]  # Hidden layers for Q-network
  hidden_layers: [400, 400, 400]  # Hidden layers for Q-network

agent:
  buffer_size: 50000  # Maximum size of the replay buffer
  batch_size: 32      # Number of experiences sampled from replay buffer for training
  gamma: 0.95         # Discount factor for future rewards
  learning_rate: 0.00001  # Learning rate for the optimizer
  tau: 0.05           # Soft update factor for target network
  epsilon_initial: 1.0  # Initial exploration rate for epsilon-greedy policy
  epsilon_decay: 0.998   # Rate at which epsilon decays per episode
  epsilon_min: 0.1     # Minimum value for epsilon

environment:
  error_size: 6       # Size of the error vector
  state_size: 7       # Size of the state vector
  servo_joints_size: 2      # Number of servo joints
  thruster_size: 4     # Number of thrusters was 4
  action_size: 4       # Number of discrete actions available
  max_episode_duration: 10.0  # Maximum duration (seconds) for each episode
  sampling_time: 0.2  # Sampling time (seconds) between actions was 0.208
  # action_interval: 2.0  # Interval (seconds) between consecutive actions
  thruster_history_length: 20  # Number of thruster actions stored for smoothness penalty
  servo_history_length: 20     # Number of servo states stored for smoothness penalty
  # action_mapping:       # Mapping of actions to control thrusters
  #   0: [1, 1]
  #   1: [1, 1]
  #   2: [1, 1]
  #   3: [-1, 1]
  #   4: [-1, 1]
  #   5: [-1, 1]
  #   6: [1, -1]
  #   7: [1, -1]
  #   8: [1, -1]
  #   9: [-1, -1]
  #   10: [-1, -1]
  #   11: [-1, -1]

  action_mapping:       # Mapping of actions to control thrusters
    0: [-1, -1]
    1: [1, -1]
    2: [-1, 1]
    3: [1, 1]

reward_function:
  w1: 1.0              # Weight for performance error
  w2: 0.2             # Weight for servo smoothness penalty
  w3: 0.0              # Weight for thruster usage penalty (keep zero)
  w4: 0.3              # Weight for thruster smoothness penalty
  w5: 0.0              # Weight for servo angle penalty (keep zero)
  w6: 0.0              # Weight for thruster delta reward
  w7: 0.5              # Weight for action delta reward

#                       # x   y   z   surge sway heave roll pitch yaw angular vel
# state_error_weights: [0.0, 0.0, 0.1, 4.0, 3.0, 0.0, 3.0, 3.0, 0.25, 0.0, 0.0, 0.0]  # Weights for individual state errors

  state_error_weights: [
    # 0.0,  # x
    # 0.0,  # y
    1.0,  # z
    4.0,  # surge
    1.0,  # sway
    # 0.0,  # heave
    1.0,  # roll
    1.0,  # pitch
    2.0  # yaw
    # 0.0,  # angular_vel_x
    # 0.0,  # angular_vel_y
    # 0.0   # angular_vel_z
  ]

training:
  max_episodes: 100    # Maximum episodes for training
  max_t: 20          # Maximum steps per episode
  target_avg_reward: 20  # Target average reward for early stopping
  plot_interval: 2    # Interval for updating plots during training
  random_seed: 42      # Random seed for reproducibility
  publish_interval: 10 # 10 secs if controller frq is 5Hz  

evaluation:
  num_episodes: 10     # Number of episodes for evaluation

plotting:
  interactive: true    # Enable interactive plotting

others:
  random_seed: 42      # General random seed for reproducibility