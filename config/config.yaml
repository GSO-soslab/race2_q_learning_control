# Configuration file for the DQN agent and environment

qnetwork:
  hidden_layers: [300, 200, 120, 80, 30]  # Hidden layers for Q-network

agent:
  buffer_size: 50000  # Maximum size of the replay buffer
  batch_size: 32      # Number of experiences sampled from replay buffer for training
  gamma: 0.95         # Discount factor for future rewards
  learning_rate: 0.0001  # Learning rate for the optimizer
  tau: 0.05           # Soft update factor for target network
  epsilon_initial: 1.0  # Initial exploration rate for epsilon-greedy policy
  epsilon_decay: 0.991   # Rate at which epsilon decays per episode
  epsilon_min: 0.2     # Minimum value for epsilon

environment:
  error_size: 12       # Size of the error vector
  servo_joints_size: 2      # Number of servo joints
  thruster_size: 4     # Number of thrusters
  action_size: 4       # Number of discrete actions available
  max_episode_duration: 10.0  # Maximum duration (seconds) for each episode
  sampling_time: 0.208  # Sampling time (seconds) between actions was 0.208
  thruster_history_length: 100  # Number of thruster actions stored for smoothness penalty
  servo_history_length: 100     # Number of servo states stored for smoothness penalty
  action_mapping:       # Mapping of actions to control thrusters
    0: [1, 1]
    1: [-1, 1]
    2: [1, -1]
    3: [-1, -1]

reward_function:
  w1: 2.0              # Weight for performance error
  w2: 2.0              # Weight for servo smoothness penalty
  w3: 0.0              # Weight for thruster usage penalty (keep zero)
  w4: 3.0              # Weight for thruster smoothness penalty
  w5: 0.0              # Weight for servo angle penalty (keep zero)
  w6: 0.0              # Weight for thruster delta reward
  state_error_weights: [0.0, 0.0, 0.5, 1.5, 0.5, 0.0, 0.5, 0.5, 1.5, 0.0, 0.0, 0.0]  # Weights for individual state errors

training:
  max_episodes: 3000    # Maximum episodes for training
  max_t: 1000          # Maximum steps per episode
  target_avg_reward: 20  # Target average reward for early stopping
  plot_interval: 10    # Interval for updating plots during training
  random_seed: 42      # Random seed for reproducibility

evaluation:
  num_episodes: 10     # Number of episodes for evaluation

plotting:
  interactive: true    # Enable interactive plotting

others:
  random_seed: 42      # General random seed for reproducibility