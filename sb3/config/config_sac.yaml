

# Setpoint configuration (episode-based instead of time-based)
setpoint:
  # Position Z range (depth) - AUV will get random depth targets each episode
  pos_z_range: [1.0, 8.0]
  
  # Orientation Z range (yaw) - Random heading targets
  ori_z_range: [-2.14, 2.14]
  
  # Orientation Y range (pitch) - Small pitch variations
  ori_y_range: [-0.1, 0.1]
  
  # Velocity X range (surge) - Forward/backward speed targets
  vel_x_range: [-0.25, 0.25]

others:
  random_seed: 42

environment:
  thruster_size: 4
  servo_joints_size: 0
  max_action: 1.0
  min_servo_angle_rad: -1.57 # -45 degrees in radians
  max_servo_angle_rad: 1.57 # 45 degrees in radians

training:
  max_episodes: 1000
  max_t: 200
  save_freq_timesteps: 10

agent:
  learning_rate: 0.0003        # REDUCED - slower learning for stability
  buffer_size: 1000000
  batch_size: 16
  gamma: 0.99
  tau: 0.005
  ent_coef: auto            # REDUCED - less exploration, more exploitation
  target_update_interval: 1
  # replay_buffer_kwargs: # Optional arguments for the replay buffer
  learning_starts: 1000

qnetwork:
  actor_hidden_layers: [256, 128, 64]
  # critic_hidden_layers: [128, 128, 128]

# Coupling-aware reward configuration - now supports all 4 methods
coupling:
  method: 'standard'  # Options: 'v1', 'v2', 'v3', 'v4', 'standard'
  
  # Base coupling strength parameters (used by all methods)
  surge_yaw_weight: 0.25      # REDUCED from 0.3 (less aggressive surge-yaw)
  pitch_depth_weight: 0.6     # INCREASED from 0.4 (stronger pitch-depth coupling)
  threshold: 0.05   

  # Progressive learning parameters (for v2)
  progressive:
    enabled: true
    exploration_episodes: 50    # Phase 1: Pure exploration
    coupling_focus_episodes: 100 # Phase 2: Focus on learning coupled pairs
    # Phase 3 (refinement) starts automatically after coupling_focus_episodes
  
  # Dynamic coupling parameters (for v3)
  dynamic:
    history_window: 15          # Number of steps to consider for correlation analysis
    adaptation_rate: 0.1        # How quickly coupling weights adapt (0.0-1.0)
  
  # Energy-based parameters (for v4)
  energy:
    spring_stiffness: 0.3     # REDUCED from 0.5 (gentler coupling)
    damping_factor: 0.4       # INCREASED from 0.2 (more damping for stability)

reward_function:
  w1: 0.8                     # REDUCED from 1.0 (less harsh energy penalty)
  w2: 0.3
  w3: 0.0
  w4: 0.4                     # INCREASED from 0.1 (more thruster smoothness)
  w5: 0.0
  w6: 0.0
  w7: 0.2                     # INCREASED from 0.1 (more action smoothness)
  w8: 0.1                     # ADDED - direction change penalty
  
  # Individual state error weights (used in coupling calculations)
  state_error_weights: [
    0.002,   # z (depth) - INCREASED for better pitch-depth coupling
    0.0005,  # surge - INCREASED to fix asymmetric response
    0.0001,  # sway
    0.0,     # heave
    0.001,     # roll
    0.001,   # pitch - INCREASED to reduce 0.3 rad error
    0.00002   # yaw - INCREASED to fix offset issue
  ]

action_penalties:
  surge_asymmetry_penalty: 0.1    # Penalty for unequal positive/negative response
  yaw_bias_penalty: 0.05      

pid_gains:
  # These are multipliers on top of state_error_weights
  P_multiplier: 1.0 # Base proportional gain multiplier
  I_multiplier: 1.0 # Base integral gain multiplier
  D_multiplier: 0.0 # Base derivative gain multiplier
  component_multipliers:
    # Adjusted for coupling-aware control
    z: [1.0, 0.0, 0.0]      # depth
    surge: [1.0, 0.0, 0.0]  # surge
    pitch: [1.0, 0.0, 0.0]  # pitch
    yaw: [1.0, 0.0, 0.0]    # yaw

plotting:
  plot_interval: 10

evaluation:
  num_episodes: 10000
  verbose: true